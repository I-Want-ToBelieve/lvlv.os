# Who can decrypt the files under secrets/. After a change here, run
# `sops updatekeys secrets/<file>.yaml` for each existing file.
keys:
  # i.want.to.believe on k99-lite-darwin; the private half is ~/.config/sops/age/keys.txt.
  - &user age1l6hjtqwj5ccagjccg8xyestwplu4flntk2yr6q3qp8r65k6ma92qar6r02
  # k99-lite's SSH host key, once NixOS has created it:
  #   ssh-to-age < /etc/ssh/ssh_host_ed25519_key.pub
  # - &k99-lite age1...

creation_rules:
  - path_regex: ^secrets/[^/]+\.yaml$
    key_groups:
      - age:
          - *user
          # - *k99-lite
