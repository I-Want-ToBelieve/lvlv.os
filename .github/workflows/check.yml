# Evaluate every host and check formatting and lints on each pull request and push to main.
name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # Each runner evaluates the hosts of its own platform; building them would take hours.
        # macos-15-intel is GitHub's x86_64-darwin runner.
        os: [ubuntu-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      # Keeps the store paths that evaluation fetches (stylix's base16 schemes and the
      # like) between runs.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
      # `nix flake check --no-build` evaluates read-only, so it cannot fetch the store paths that
      # evaluation reads, such as the base16 scheme stylix takes from base16-schemes. A plain
      # evaluation of what it checks (this platform's checks and every NixOS host) fetches them
      # first, without building any host.
      - name: Fetch the store paths that evaluation reads
        run: |
          system=$(nix config show system)
          nix eval ".#checks.$system" --apply 'builtins.mapAttrs (_: check: check.drvPath)'
          nix eval .#nixosConfigurations \
            --apply 'builtins.mapAttrs (_: host: host.config.system.build.toplevel.drvPath)'
      - run: nix flake check --no-build
      - run: nix fmt -- --ci
