# Evaluate every host and check formatting and lints on each pull request and push to main.
name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # Each runner evaluates the hosts of its own platform; building them would take hours.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      # Keeps the store paths that evaluation fetches (stylix's base16 schemes and the
      # like) between runs.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      - run: nix flake check --no-build
      - run: nix fmt -- --ci
