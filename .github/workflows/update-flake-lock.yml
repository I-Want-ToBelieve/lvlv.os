# Once a week, a pull request that updates flake.lock; the check workflow evaluates it.
# Needs "Allow GitHub Actions to create and approve pull requests" in the repository settings.
name: update-flake-lock

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 6"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: DeterminateSystems/update-flake-lock@v29
        with:
          pr-title: "chore: update flake.lock"
          commit-msg: "chore: update flake.lock"
